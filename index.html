.controls-container {

  flex-direction: column;

.search-input {

.filter-tags { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.filter-btn {

  border-radius: 20px;

.filter-btn.active, .filter-btn:hover {

  color: white;
  border-color: transparent;

  font-size: 1.6rem;
  letter-spacing: 1px;

.grid-jeux {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 0 15px;
  max-width: 1200px;
  margin: auto;
}
@media (min-width: 768px) {
  .grid-jeux { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
}

.jeu-card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border-glow);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  position: relative;

.jeu-card:hover {
  transform: translateY(-5px);
  border-color: var(--accent-cyan);
  box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
}

.stock-badge.out { color: #e74c3c; border-color: rgba(231, 76, 60, 0.4); }

.info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
.jeu-nom { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); min-height: 38px; cursor: pointer; }
.prix { color: var(--accent-cyan); font-weight: 700; font-size: 1.1rem; margin-bottom: 12px; }

.btn-group { display: flex; gap: 8px; }
.btn-buy {

  text-decoration: none;
  padding: 10px;
  border-radius: 8px;
  flex: 3;
  font-weight: 600;
  font-size: 0.8rem;
  text-transform: uppercase;
  text-align: center;
  border: none;
  cursor: pointer;
  transition: 0.2s;
}
.btn-buy:hover { opacity: 0.9; }
.btn-buy.disabled { background: #444; cursor: not-allowed; pointer-events: none; }
.btn-cart {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  border: 1px solid var(--border-glow);
  padding: 10px;
  border-radius: 8px;

/* Modale */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
.modal-content { background: #161b22; border-radius: 20px; max-width: 500px; width: 100%; padding: 25px; border: 1px solid var(--accent-cyan); position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2); }
.close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; color: var(--text-muted); cursor: pointer; }
.modal-title { font-family: 'Rajdhani', sans-serif; color: var(--accent-cyan); margin-top: 0; font-size: 1.6rem; text-transform: uppercase; }
.modal-details { font-size: 0.9rem; line-height: 1.6; color: var(--text-main); margin: 15px 0; }

.color-options { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.color-bubble {

  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.2s, border-color 0.2s;

.color-bubble:hover { transform: scale(1.1); }
.color-bubble.selected {

footer { margin-top: 60px; padding: 30px; border-top: 1px solid var(--border-glow); color: var(--text-muted); font-size: 0.85rem; text-align: center; }
</style>
</head>

function generer(liste, id, estChaussure = false) {
const container = document.getElementById(id);
if (!container) return;

container.innerHTML = liste.map(j => {
const enStock = !estChaussure || (j.stock > 0);
const badgeStock = estChaussure ?
`<div class="stock-badge ${enStock ? '' : 'out'}">${enStock ? 'Stock: ' + j.stock : 'Épuisé'}</div>` : '';

const nomSecurise = j.n.replace(/'/g, "\\'");

return `
<div class="jeu-card" data-nom="${j.n.toLowerCase()}" data-prix="${j.p}">
${badgeStock}
<img src="${j.img}" alt="${j.n}" onclick="ouvrirModal('${nomSecurise}', ${estChaussure})">
<div class="info">
<div class="jeu-nom" onclick="ouvrirModal('${nomSecurise}', ${estChaussure})">${j.n}</div>
<div class="prix">${j.p.toLocaleString()} F</div>
<div class="btn-group">
${enStock ?
`<button onclick="ouvrirModal('${nomSecurise}',${estChaussure})" class="btn-buy">Acheter</button>` :
`<button class="btn-buy disabled">Épuisé</button>`
}

</div>
</div>
`}).join('');
}

function filtrerCatalogue() {
const recherche = document.getElementById('searchBar').value.toLowerCase();
const cards = document.querySelectorAll('.jeu-card');

cards.forEach(card => {
const nom = card.getAttribute('data-nom');
const prix = parseInt(card.getAttribute('data-prix'));

const correspondanceNom = nom.includes(recherche);
const correspondancePrix = (prixMaxFiltre === 'all') || (prix <= prixMaxFiltre);

card.style.display = (correspondanceNom && correspondancePrix) ? 'flex' : 'none';
});
}

function filtrerPrix(max, element) {
prixMaxFiltre = max;
document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
element.classList.add('active');
filtrerCatalogue();
}

function ouvrirModal(nom, estChaussure) {
const produit = [...listeJeux, ...listeAccessoires].find(item => item.n === nom);
if (!produit) return;

document.getElementById('modalNom').innerText = produit.n;
document.getElementById('modalImg').src = produit.img;

let contenu = `<ul style="list-style:none;"><li><b>Prix :</b> <span style="color:var(--accent-cyan); font-weight:bold;">${produit.p.toLocaleString()} FCFA</span></li>`;

if (estChaussure) {
contenu += `<li><b>Stock restant :</b> ${produit.stock > 0 ? produit.stock + ' unité(s)' : '<span style="color:#e74c3c">Rupture de stock</span>'}</li>`;

if (produit.pointures && produit.pointures.length > 0) {
contenu += `<br><label><b>Choisir la pointure :</b></label>
<select id="pointureSelect">
${produit.pointures.map(pt => `<option value="${pt}">${pt}</option>`).join('')}
</select>`;
}

if (produit.couleurs && produit.couleurs.length > 0) {
couleurSelectionnee = produit.couleurs[0].nom;
contenu += `<br><label><b>Couleur : <span id="labelCouleur" style="color:var(--accent-cyan);">${couleurSelectionnee}</span></b></label>
<div class="color-options">
${produit.couleurs.map((c, index) => `
<div class="color-bubble ${index === 0 ? 'selected' : ''}"
style="background-color: ${c.code};"
title="${c.nom}"
onclick="choisirCouleur('${c.nom.replace(/'/g, "\\'")}', this)">
</div>
`).join('')}
</div>`;
}

} else {
contenu += `<li><b>Configuration :</b> ${produit.req || 'N/A'}</li>
<li><b>Taille :</b> ${produit.tail || 'N/A'}</li>`;
}

contenu += `</ul>`;
document.getElementById('modalDetails').innerHTML = contenu;

const buyBtn = document.getElementById('modalBuyBtn');
const nomSecurise = produit.n.replace(/'/g, "\\'");
if (estChaussure && produit.stock <= 0) {
buyBtn.classList.add('disabled');
buyBtn.innerText = "Produit épuisé";
buyBtn.onclick = null;
} else {
buyBtn.classList.remove('disabled');
buyBtn.innerText = "Acheter maintenant";
buyBtn.onclick = () => acheterDirect(nomSecurise, produit.p, estChaussure);
}

document.getElementById('productModal').style.display = 'flex';
}

function choisirCouleur(nomCouleur, el) {
couleurSelectionnee = nomCouleur;
document.getElementById('labelCouleur').innerText = nomCouleur;

document.querySelectorAll('.color-bubble').forEach(b => b.classList.remove('selected'));
el.classList.add('selected');
}

function acheterDirect(nomProduit, prixProduit, estChaussure) {
let message = `Bonjour Asseko Store, je souhaite acheter : ${nomProduit} (${prixProduit.toLocaleString()} FCFA)`;

if (estChaussure) {
const selectPointure = document.getElementById('pointureSelect');
const pointure = selectPointure ? selectPointure.value : "";

if (pointure) message += ` - Pointure: ${pointure}`;
if (couleurSelectionnee) message += ` - Couleur: ${couleurSelectionnee}`;
}

const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
window.open(url, '_blank');
}

function fermerModal() {
document.getElementById('productModal').style.display = 'none';
}

function add(n, p) {
let panier = JSON.parse(localStorage.getItem('asseko_panier')) || [];
panier.push({nom: n, prix: p});
localStorage.setItem('asseko_panier', JSON.stringify(panier));
maj();
alert("Ajouté au panier !");
}

function maj() {
let p = JSON.parse(localStorage.getItem('asseko_panier')) || [];
let el = document.querySelector('#cart-counter span');
if (el) el.innerText = "(" + p.length + ")";
}

window.onload = () => {
generer(listeJeux, 'catalogue', false);
generer(listeAccessoires, 'catalogue-chaussures', true);
maj();
};
</script>
