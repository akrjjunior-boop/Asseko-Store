<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asseko Store - Jeux PC & Accessoires</title>
<style>
:root { 
  --primary: #27ae60; 
  --primary-hover: #219150; 
  --bg: #121212; 
  --card: #1e1e1e; 
  --text: #ffffff;
}

body { 
  background: var(--bg); 
  color: var(--text); 
  font-family: 'Segoe UI', Roboto, sans-serif; 
  margin: 0; 
  padding-bottom: 60px; 
}

/* Bandeau Promo */
.top-bar {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 8px 10px;
  font-size: 0.85rem;
  font-weight: bold;
  letter-spacing: 0.5px;
}

header { 
  padding: 30px 20px 20px; 
  background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%); 
  border-bottom: 2px solid var(--primary); 
  text-align: center; 
}

.logo-style { 
  width: 90px; 
  height: 90px; 
  border-radius: 50%; 
  border: 3px solid var(--primary); 
  object-fit: cover; 
  box-shadow: 0 0 15px rgba(39, 174, 96, 0.3); 
  margin-bottom: 10px; 
}

h1 { margin: 5px 0; font-size: 1.8rem; letter-spacing: 1px; }

/* Badges de Confiance */
.features-bar {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  padding: 15px 10px;
  background: #181818;
  border-bottom: 1px solid #2a2a2a;
  font-size: 0.8rem;
}
.feature-item { display: flex; align-items: center; gap: 6px; color: #ccc; }

/* Panier Flottant */
.cart-status { 
  position: fixed; 
  bottom: 20px; 
  right: 20px; 
  background: #f39c12; 
  padding: 12px 20px; 
  border-radius: 50px; 
  font-weight: bold; 
  text-decoration: none; 
  color: white; 
  z-index: 999; 
  box-shadow: 0 5px 20px rgba(0,0,0,0.6); 
  border: 2px solid white; 
  display: flex; 
  align-items: center; 
  gap: 8px; 
}

/* WhatsApp Flottant */
.whatsapp-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #25d366;
  color: white;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  text-decoration: none;
  z-index: 999;
  box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}

/* Recherche & Filtres */
.controls-container {
  max-width: 1000px;
  margin: 25px auto 10px;
  padding: 0 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.search-input {
  width: 100%;
  padding: 12px 18px;
  border-radius: 25px;
  border: 1px solid #333;
  background: #1e1e1e;
  color: white;
  font-size: 0.95rem;
  box-sizing: border-box;
  outline: none;
}
.search-input:focus { border-color: var(--primary); }

.filter-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.filter-btn {
  background: #222;
  border: 1px solid #333;
  color: #ccc;
  padding: 6px 14px;
  border-radius: 15px;
  cursor: pointer;
  font-size: 0.8rem;
}
.filter-btn.active, .filter-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

.section-title { text-align: center; margin: 30px 0 15px; color: var(--primary); text-transform: uppercase; font-size: 1.3rem; }

/* Grille produits */
.grid-jeux { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; max-width: 1200px; margin: auto; }
@media (min-width: 768px) { .grid-jeux { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; } }

.jeu-card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid #2a2a2a; transition: 0.2s; display: flex; flex-direction: column; }
.jeu-card:hover { transform: translateY(-3px); border-color: #444; }
.jeu-card img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; }

.info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
.jeu-nom { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #eee; min-height: 34px; cursor: pointer; }
.prix { color: var(--primary); font-weight: 800; font-size: 1rem; margin-bottom: 10px; }

.btn-group { display: flex; gap: 6px; }
.btn-buy { background: var(--primary); color: white; text-decoration: none; padding: 8px; border-radius: 8px; flex: 3; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; text-align: center; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.btn-cart { background: #333; color: white; border: none; padding: 8px; border-radius: 8px; cursor: pointer; flex: 1; font-size: 0.9rem; }
.btn-cart:hover { background: #444; }

/* Fenêtre Modale Produit */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
.modal-content { background: var(--card); border-radius: 16px; max-width: 500px; width: 100%; padding: 20px; border: 1px solid var(--primary); position: relative; max-height: 90vh; overflow-y: auto; }
.close-modal { position: absolute; top: 12px; right: 15px; font-size: 1.5rem; color: #888; cursor: pointer; }
.modal-title { color: var(--primary); margin-top: 0; font-size: 1.4rem; }
.modal-details { font-size: 0.85rem; line-height: 1.5; color: #ddd; margin: 15px 0; }
.modal-details ul { padding-left: 18px; margin: 8px 0; }

footer { margin-top: 50px; padding: 30px; border-top: 1px solid #222; color: #666; font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>

<!-- Bandeau Promo -->
<div class="top-bar">🔥 OFFRE SPÉCIALE : Livraison ultra-rapide par WhatsApp après validation !</div>

<header>
<img src="logo2.png" class="logo-style" alt="Logo">
<h1>ASSEKO<span style="color: var(--primary);">STORE</span></h1>
</header>

<!-- Badges de Confiance -->
<div class="features-bar">
  <div class="feature-item">⚡ <span>Livraison rapide</span></div>
  <div class="feature-item">📱 <span>Airtel & Moov Money</span></div>
  <div class="feature-item">🎮 <span>Jeux PC 100% Fonctionnels</span></div>
</div>

<!-- Panier Flottant -->
<a href="panier.html" class="cart-status" id="cart-counter">🛒 <span>(0)</span></a>

<!-- Support WhatsApp -->
<a href="https://wa.me/24100000000" class="whatsapp-btn" target="_blank" title="Besoin d'aide ?">💬</a>

<!-- Recherche & Filtres -->
<div class="controls-container">
  <input type="text" id="searchBar" class="search-input" placeholder="🔍 Rechercher un jeu ou une chaussure..." onkeyup="filtrerCatalogue()">
  <div class="filter-tags">
    <button class="filter-btn active" onclick="filtrerPrix('all', this)">Tous les prix</button>
    <button class="filter-btn" onclick="filtrerPrix(4000, this)">Moins de 4 000 F</button>
    <button class="filter-btn" onclick="filtrerPrix(6000, this)">Moins de 6 000 F</button>
  </div>
</div>

<h2 class="section-title">Catalogue Jeux PC</h2>
<div class="grid-jeux" id="catalogue"></div>

<h2 class="section-title">Chaussures & Accessoires</h2>
<div class="grid-jeux" id="catalogue-chaussures"></div>

<!-- Pop-up Fiche Produit -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <span class="close-modal" onclick="fermerModal()">&times;</span>
    <h3 class="modal-title" id="modalNom">Nom du produit</h3>
    <img id="modalImg" src="" style="width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:10px;">
    <div class="modal-details" id="modalDetails"></div>
    <div style="display:flex; gap:10px;">
      <a id="modalBuyBtn" href="#" class="btn-buy" style="padding: 12px;">Acheter maintenant</a>
    </div>
  </div>
</div>

<footer>
<img src="logo2.png" class="logo-style" alt="Logo Footer"><br><br>
Asseko Store - Tous droits réservés
</footer>

<script>
// Catalogues enrichis avec détails pour la fenêtre pop-up
const listeJeux = [
{n: "WWE 2K25", p: 8000, img: "https://i.pinimg.com/1200x/c7/ac/6d/c7ac6d5ef0a6ec03e70bdcf4de6e66be.jpg", req: "8 Go RAM, GTX 1060 min.", tail: "60 Go", yt: "https://www.youtube.com/results?search_query=WWE+2K25+trailer"},

{n: "CoD Black Ops 6", p: 7000, img: "https://i.pinimg.com/736x/4b/17/2a/4b172acbb1a31cf30cfd712e4bb94928.jpg", req: "12 Go RAM, GTX 1060", tail: "100 Go", yt: "https://www.youtube.com/results?search_query=Black+Ops+6+trailer"},
{n: "God of War", p: 7000, img: "https://i.pinimg.com/1200x/a1/84/9b/a1849baa4d6ccda5098080ad5097e359.jpg", req: "8 Go RAM, GTX 960", tail: "70 Go", yt: "https://www.youtube.com/results?search_query=God+of+War+PC+trailer"},
{n: "Cyberpunk 2077", p: 5500, img: "https://i.pinimg.com/1200x/76/a4/9a/76a49a5f00a20d5ea0df8dafbbb514bc.jpg", req: "12 Go RAM, GTX 1060", tail: "70 Go", yt: "https://www.youtube.com/results?search_query=Cyberpunk+2077+trailer"},
{n: "Naruto Shinobi Strike", p: 5500, img: "https://i.pinimg.com/736x/ad/05/b2/ad05b260717d91bc4892c5d89eca5c80.jpg", req: "6 Go RAM, GTX 660", tail: "40 Go", yt: ""},
{n: "DBZ Sparking Zero", p: 5000, img: "https://i.pinimg.com/736x/e2/aa/6a/e2aa6ae9d6afe729a1d621000fb15405.jpg", req: "8 Go RAM, GTX 970", tail: "30 Go", yt: ""},
{n: "DBZ Kakarot", p: 5000, img: "https://i.pinimg.com/736x/03/77/39/0377395b7989c414483e580896048cf1.jpg", req: "6 Go RAM, GTX 750 Ti", tail: "40 Go", yt: ""},
{n: "Naruto Connections", p: 5000, img: "https://i.pinimg.com/1200x/b4/bf/d2/b4bfd24ee83c4df44bad28dc17631001.jpg", req: "8 Go RAM, GTX 960", tail: "30 Go", yt: ""},
{n: "CoD MW3", p: 5000, img: "https://i.pinimg.com/736x/de/e7/a2/dee7a2209580884a5b63615206169c9b.jpg", req: "8 Go RAM, GTX 970", tail: "80 Go", yt: ""},
{n: "NFS Heat Deluxe", p: 4500, img: "https://i.pinimg.com/736x/2e/c9/fa/2ec9fad416ac4fe639f50184aba77aee.jpg", req: "8 Go RAM, GTX 1060", tail: "50 Go", yt: ""},
{n: "F1 2022", p: 4500, img: "https://i.pinimg.com/1200x/20/ad/a9/20ada9cd59ea21f2f8658df69ef9c218.jpg", req: "8 Go RAM, GTX 1050 Ti", tail: "80 Go", yt: ""},
{n: "FIFA 22", p: 4000, img: "https://i.pinimg.com/736x/df/7a/71/df7a71474e3b8fb87ce816bb79b23476.jpg", req: "8 Go RAM, GTX 1050", tail: "50 Go", yt: ""},
{n: "GTA V", p: 4000, img: "https://i.pinimg.com/736x/fe/30/39/fe3039c9dde62dfd179915be1ea5905d.jpg", req: "8 Go RAM, GTX 660", tail: "90 Go", yt: ""},
{n: "Naruto Storm 4", p: 4000, img: "https://i.pinimg.com/1200x/68/a4/a5/68a4a556802033962ab4e8327b848561.jpg", req: "4 Go RAM, GTX 750", tail: "40 Go", yt: ""},
{n: "Jump Force", p: 4000, img: "https://i.pinimg.com/736x/25/30/66/25306638ebe76311cfbf6bde6caae84f.jpg", req: "8 Go RAM, GTX 1060", tail: "20 Go", yt: ""},
{n: "FIFA 21", p: 4500, img: "https://i.pinimg.com/736x/24/73/05/247305ab8d34bc58cece9964c5d48b42.jpg", req: "8 Go RAM, GTX 660", tail: "50 Go", yt: ""},
{n: "NBA 2K23", p: 4500, img: "https://i.pinimg.com/736x/20/e7/20/20e7206b03a82fcb026375627008d4bb.jpg", req: "8 Go RAM, GTX 770", tail: "110 Go", yt: ""},
{n: "Test Drive Unlimited 2", p: 3500, img: "https://i.pinimg.com/1200x/96/91/bf/9691bf3993f312e2ed4744c392061ca8.jpg", req: "2 Go RAM, GT 8800", tail: "15 Go", yt: ""},
{n: "Naruto Storm Revolution", p: 3500, img: "https://i.pinimg.com/736x/c9/26/38/c926388ae9d01a6e3bc70d439a1eb0f6.jpg", req: "4 Go RAM", tail: "8 Go", yt: ""},
{n: "FIFA 20", p: 3500, img: "https://i.pinimg.com/736x/cc/d4/3c/ccd43c3af807fd2650e6782764f13e78.jpg", req: "8 Go RAM", tail: "45 Go", yt: ""},
{n: "Efootball 21", p: 4000, img: "https://i.pinimg.com/736x/01/39/9e/01399ef1fba685b0fee527e7478eb3d1.jpg", req: "8 Go RAM, GTX 670", tail: "40 Go", yt: ""},
{n: "Assassin's Creed Revelations", p: 3000, img: "https://i.pinimg.com/736x/e0/80/7a/e0807a9df4e4d5a9542c3a133e6b5821.jpg", req: "2 Go RAM", tail: "12 Go", yt: ""},
{n: "PES 2018", p: 3000, img: "https://i.pinimg.com/736x/86/f9/f5/86f9f5b37e94acfd341eab4ae9f507ab.jpg", req: "4 Go RAM", tail: "25 Go", yt: ""},
{n: "Minecraft Story Mode", p: 2500, img: "https://i.pinimg.com/1200x/91/9e/6f/919e6f51cc7bd1fc0c8b1187057b22f5.jpg", req: "3 Go RAM", tail: "6 Go", yt: ""},
{n: "FIFA 17", p: 2500, img: "https://i.pinimg.com/1200x/80/ed/ee/80edee894a2cd179caedb4134d1a427b.jpg", req: "8 Go RAM", tail: "35 Go", yt: ""},
{n: "PES 17", p: 2500, img: "https://i.pinimg.com/736x/c5/7f/5f/c57f5f0515e4850f1d55ce257268bfec.jpg", req: "1 Go RAM", tail: "12 Go", yt: ""}
];

const listeAccessoires = [
{n: "Nike Mercurial Vapor 16", p: 20000, img: "https://i.pinimg.com/1200x/d6/bd/63/d6bd637c9795be8d2b0ad64fa1784295.jpg", req: "Pointures disponibles : 40 à 45", tail: "Livraison physique", yt: ""},
{n: "Jordan 3 black", p: 15000, img: "https://i.pinimg.com/736x/ed/36/75/ed36753fa4238548f79fcf8e13ebfc65.jpg", req: "Pointures disponibles : 39 à 44", tail: "Livraison physique", yt: ""}
];

let prixMaxFiltre = 'all';

function generer(liste, id) {
  const container = document.getElementById(id);
  container.innerHTML = liste.map(j => `
    <div class="jeu-card" data-nom="${j.n.toLowerCase()}" data-prix="${j.p}">
      <img src="${j.img}" alt="${j.n}" onclick="ouvrirModal('${j.n}')">
      <div class="info">
        <div class="jeu-nom" onclick="ouvrirModal('${j.n}')">${j.n}</div>
        <div class="prix">${j.p.toLocaleString()} F</div>
        <div class="btn-group">
          <a href="paiement.html?jeu=${encodeURIComponent(j.n)}&prix=${j.p}" class="btn-buy">Acheter</a>
          <button onclick="add('${j.n}', ${j.p})" class="btn-cart">🛒</button>
        </div>
      </div>
    </div>
  `).join('');
}

// Recherche & Filtres
function filtrerCatalogue() {
  const recherche = document.getElementById('searchBar').value.toLowerCase();
  const cards = document.querySelectorAll('.jeu-card');
  
  cards.forEach(card => {
    const nom = card.getAttribute('data-nom');
    const prix = parseInt(card.getAttribute('data-prix'));
    
    const correspondanceNom = nom.includes(recherche);
    const correspondancePrix = (prixMaxFiltre === 'all') || (prix <= prixMaxFiltre);

    if (correspondanceNom && correspondancePrix) {
      card.style.display = 'flex';
    } else {
      card.style.display = 'none';
    }
  });
}

function filtrerPrix(max, element) {
  prixMaxFiltre = max;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');
  filtrerCatalogue();
}

// Pop-up Produit
function ouvrirModal(nom) {
  const produit = [...listeJeux, ...listeAccessoires].find(item => item.n === nom);
  if (!produit) return;

  document.getElementById('modalNom').innerText = produit.n;
  document.getElementById('modalImg').src = produit.img;
  
  let contenu = `<ul>
    <li><b>Prix :</b> ${produit.p.toLocaleString()} FCFA</li>
    <li><b>Spécifications / Config :</b> ${produit.req || 'N/A'}</li>
    <li><b>Taille / Info :</b> ${produit.tail || 'N/A'}</li>
  </ul>`;
  
  if(produit.yt) {
    contenu += `<p><a href="${produit.yt}" target="_blank" style="color:var(--primary);">📺 Voir le trailer sur YouTube</a></p>`;
  }

  document.getElementById('modalDetails').innerHTML = contenu;
  document.getElementById('modalBuyBtn').href = `paiement.html?jeu=${encodeURIComponent(produit.n)}&prix=${produit.p}`;
  document.getElementById('productModal').style.display = 'flex';
}

function fermerModal() {
  document.getElementById('productModal').style.display = 'none';
}

// Panier
function add(n, p) {
  let panier = JSON.parse(localStorage.getItem('asseko_panier')) || [];
  panier.push({nom: n, prix: p});
  localStorage.setItem('asseko_panier', JSON.stringify(panier));
  maj();
  alert("Ajouté au panier !");
}

function maj() {
  let p = JSON.parse(localStorage.getItem('asseko_panier')) || [];
  let el = document.querySelector('#cart-counter span');
  if (el) el.innerText = "(" + p.length + ")";
}

window.onload = () => {
  generer(listeJeux, 'catalogue');
  generer(listeAccessoires, 'catalogue-chaussures');
  maj();
};
</script>
</body>
</html>
