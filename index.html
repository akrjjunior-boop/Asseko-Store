<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asseko Store - Jeux PC & Accessoires</title>
<style>
:root {
--primary: #27ae60;
--primary-hover: #219150;
--bg: #121212;
--card: #1e1e1e;
--text: #ffffff;
}

body {
background: var(--bg);
color: var(--text);
font-family: 'Segoe UI', Roboto, sans-serif;
margin: 0;
padding-bottom: 60px;
}

.top-bar {
background: var(--primary);
color: white;
text-align: center;
padding: 8px 10px;
font-size: 0.85rem;
font-weight: bold;
letter-spacing: 0.5px;
}

header {
padding: 30px 20px 20px;
background: linear-gradient(180deg, #1a1a1a 0%, #121212 100%);
border-bottom: 2px solid var(--primary);
text-align: center;
}

.logo-style {
width: 90px;
height: 90px;
border-radius: 50%;
border: 3px solid var(--primary);
object-fit: cover;
box-shadow: 0 0 15px rgba(39, 174, 96, 0.3);
margin-bottom: 10px;
}

h1 { margin: 5px 0; font-size: 1.8rem; letter-spacing: 1px; }

.features-bar {
display: flex;
justify-content: center;
gap: 15px;
flex-wrap: wrap;
padding: 15px 10px;
background: #181818;
border-bottom: 1px solid #2a2a2a;
font-size: 0.8rem;
}
.feature-item { display: flex; align-items: center; gap: 6px; color: #ccc; }

.cart-status {
position: fixed;
bottom: 20px;
right: 20px;
background: #f39c12;
padding: 12px 20px;
border-radius: 50px;
font-weight: bold;
text-decoration: none;
color: white;
z-index: 999;
box-shadow: 0 5px 20px rgba(0,0,0,0.6);
border: 2px solid white;
display: flex;
align-items: center;
gap: 8px;
}

.whatsapp-btn {
position: fixed;
bottom: 20px;
left: 20px;
background: #25d366;
color: white;
width: 50px;
height: 50px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.5rem;
text-decoration: none;
z-index: 999;
box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}

.controls-container {
max-width: 1000px;
margin: 25px auto 10px;
padding: 0 15px;
display: flex;
flex-direction: column;
gap: 12px;
}
.search-input {
width: 100%;
padding: 12px 18px;
border-radius: 25px;
border: 1px solid #333;
background: #1e1e1e;
color: white;
font-size: 0.95rem;
box-sizing: border-box;
outline: none;
}
.search-input:focus { border-color: var(--primary); }

.filter-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.filter-btn {
background: #222;
border: 1px solid #333;
color: #ccc;
padding: 6px 14px;
border-radius: 15px;
cursor: pointer;
font-size: 0.8rem;
}
.filter-btn.active, .filter-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

.section-title { text-align: center; margin: 30px 0 15px; color: var(--primary); text-transform: uppercase; font-size: 1.3rem; }

.grid-jeux { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; max-width: 1200px; margin: auto; }
@media (min-width: 768px) { .grid-jeux { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; } }

.jeu-card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid #2a2a2a; transition: 0.2s; display: flex; flex-direction: column; position: relative; }
.jeu-card:hover { transform: translateY(-3px); border-color: #444; }
.jeu-card img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; }

.stock-badge {
position: absolute;
top: 10px;
right: 10px;
background: rgba(0,0,0,0.75);
color: #27ae60;
padding: 4px 8px;
border-radius: 8px;
font-size: 0.7rem;
font-weight: bold;
}
.stock-badge.out { color: #e74c3c; }

.info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
.jeu-nom { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #eee; min-height: 34px; cursor: pointer; }
.prix { color: var(--primary); font-weight: 800; font-size: 1rem; margin-bottom: 10px; }

.btn-group { display: flex; gap: 6px; }
.btn-buy { background: var(--primary); color: white; text-decoration: none; padding: 8px; border-radius: 8px; flex: 3; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; text-align: center; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.btn-buy.disabled { background: #555; cursor: not-allowed; pointer-events: none; }
.btn-cart { background: #333; color: white; border: none; padding: 8px; border-radius: 8px; cursor: pointer; flex: 1; font-size: 0.9rem; }
.btn-cart:hover { background: #444; }

/* Modale */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
.modal-content { background: var(--card); border-radius: 16px; max-width: 500px; width: 100%; padding: 20px; border: 1px solid var(--primary); position: relative; max-height: 90vh; overflow-y: auto; }
.close-modal { position: absolute; top: 12px; right: 15px; font-size: 1.5rem; color: #888; cursor: pointer; }
.modal-title { color: var(--primary); margin-top: 0; font-size: 1.4rem; }
.modal-details { font-size: 0.85rem; line-height: 1.5; color: #ddd; margin: 15px 0; }

/* Styles spécifiques aux sélecteurs Chaussures */
.modal-details select {
width: 100%;
padding: 10px;
border-radius: 8px;
background: #222;
color: white;
border: 1px solid #444;
margin-top: 5px;
font-size: 0.9rem;
outline: none;
}

/* Bulles de Couleur */
.color-options {
display: flex;
gap: 12px;
margin-top: 8px;
flex-wrap: wrap;
}
.color-bubble {
width: 32px;
height: 32px;
border-radius: 50%;
cursor: pointer;
border: 2px solid transparent;
transition: transform 0.2s, border-color 0.2s;
box-shadow: 0 2px 5px rgba(0,0,0,0.5);
position: relative;
}
.color-bubble:hover { transform: scale(1.1); }
.color-bubble.selected {
border-color: var(--primary);
transform: scale(1.15);
box-shadow: 0 0 10px var(--primary);
}

footer { margin-top: 50px; padding: 30px; border-top: 1px solid #222; color: #666; font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>

<div class="top-bar">🔥 OFFRE SPÉCIALE : Livraison ultra-rapide par WhatsApp après validation !</div>

<header>
<img src="logo2.png" class="logo-style" alt="Logo">
<h1>ASSEKO<span style="color: var(--primary);">STORE</span></h1>
</header>

<div class="features-bar">
<div class="feature-item">⚡ <span>Livraison rapide</span></div>
<div class="feature-item">📱 <span>Airtel & Moov Money</span></div>
<div class="feature-item">🎮 <span>Jeux PC & Accessoires</span></div>
</div>

<a href="panier.html" class="cart-status" id="cart-counter">🛒 <span>(0)</span></a>
<a href="https://wa.me/24100000000" class="whatsapp-btn" target="_blank" title="Besoin d'aide ?">💬</a>

<div class="controls-container">
<input type="text" id="searchBar" class="search-input" placeholder="🔍 Rechercher un jeu ou une chaussure..." onkeyup="filtrerCatalogue()">
<div class="filter-tags">
<button class="filter-btn active" onclick="filtrerPrix('all', this)">Tous les prix</button>
<button class="filter-btn" onclick="filtrerPrix(4000, this)">Moins de 4 000 F</button>
<button class="filter-btn" onclick="filtrerPrix(6000, this)">Moins de 6 000 F</button>
</div>
</div>

<h2 class="section-title">Catalogue Jeux PC</h2>
<div class="grid-jeux" id="catalogue"></div>

<h2 class="section-title">Chaussures & Accessoires</h2>
<div class="grid-jeux" id="catalogue-chaussures"></div>

<!-- Pop-up Fiche Produit -->
<div class="modal" id="productModal">
<div class="modal-content">
<span class="close-modal" onclick="fermerModal()">&times;</span>
<h3 class="modal-title" id="modalNom">Nom du produit</h3>
<img id="modalImg" src="" style="width:100%; height:200px; object-fit:cover; border-radius:10px; margin-bottom:10px;">
<div class="modal-details" id="modalDetails"></div>
<div style="display:flex; gap:10px;">
<button id="modalBuyBtn" class="btn-buy" style="padding: 12px; width:100%;">Acheter maintenant</button>
</div>
</div>
</div>

<footer>
<img src="logo2.png" class="logo-style" alt="Logo Footer"><br><br>
Asseko Store - Tous droits réservés
</footer>

<script>
const listeJeux = [
{n: "WWE 2K25", p: 8000, img: "https://i.pinimg.com/1200x/c7/ac/6d/c7ac6d5ef0a6ec03e70bdcf4de6e66be.jpg", req: "8 Go RAM, GTX 1060 min.", tail: "60 Go", yt: ""},
{n: "GoW Ragnarok", p: 8000, img: "https://i.pinimg.com/736x/8f/cc/bc/8fccbc000427939ea63559a8f1b4cc03.jpg", req: "16 Go RAM, RTX 2060 min.", tail: "110 Go", yt: ""},
{n: "CoD Black Ops 6", p: 7000, img: "https://i.pinimg.com/736x/4b/17/2a/4b172acbb1a31cf30cfd712e4bb94928.jpg", req: "12 Go RAM, GTX 1060", tail: "100 Go", yt: ""},
{n: "God of War", p: 7000, img: "https://i.pinimg.com/1200x/a1/84/9b/a1849baa4d6ccda5098080ad5097e359.jpg", req: "8 Go RAM, GTX 960", tail: "70 Go", yt: ""},
{n: "Cyberpunk 2077", p: 5500, img: "https://i.pinimg.com/1200x/76/a4/9a/76a49a5f00a20d5ea0df8dafbbb514bc.jpg", req: "12 Go RAM, GTX 1060", tail: "70 Go", yt: ""},
{n: "GTA V", p: 4000, img: "https://i.pinimg.com/736x/fe/30/39/fe3039c9dde62dfd179915be1ea5905d.jpg", req: "8 Go RAM, GTX 660", tail: "90 Go", yt: ""}
];

// Configuration Chaussures avec Bulles de Couleurs (code HEX/couleur) + Pointures
const listeAccessoires = [
{
n: "Nike Mercurial Vapor 16",
p: 20000,
img: "https://i.pinimg.com/1200x/d6/bd/63/d6bd637c9795be8d2b0ad64fa1784295.jpg",
stock: 5,
pointures: [40, 41, 42, 43, 44, 45],
couleurs: [
{nom: "Noir", code: "#000000"},
{nom: "Rose", code: "#e91e63"},
{nom: "Blanc", code: "#ffffff"}
]
},
{
n: "Jordan 3 black",
p: 15000,
img: "https://i.pinimg.com/736x/ed/36/75/ed36753fa4238548f79fcf8e13ebfc65.jpg",
stock: 3,
pointures: [39, 40, 41, 42, 43],
couleurs: [
{nom: "Noir / Gris", code: "#222222"},
{nom: "Rouge", code: "#d32f2f"}
]
}
];

let prixMaxFiltre = 'all';
let couleurSelectionnee = "";

function generer(liste, id, estChaussure = false) {
const container = document.getElementById(id);
container.innerHTML = liste.map(j => {
const enStock = !estChaussure || (j.stock > 0);
const badgeStock = estChaussure ?
`<div class="stock-badge ${enStock ? '' : 'out'}">${enStock ? 'Stock: ' + j.stock : 'Épuisé'}</div>` : '';

return `
<div class="jeu-card" data-nom="${j.n.toLowerCase()}" data-prix="${j.p}">
${badgeStock}
<img src="${j.img}" alt="${j.n}" onclick="ouvrirModal('${j.n}', ${estChaussure})">
<div class="info">
<div class="jeu-nom" onclick="ouvrirModal('${j.n}', ${estChaussure})">${j.n}</div>
<div class="prix">${j.p.toLocaleString()} F</div>
<div class="btn-group">
${enStock ?
`<button onclick="ouvrirModal('${j.n}', ${estChaussure})" class="btn-buy">Acheter</button>` :
`<button class="btn-buy disabled">Épuisé</button>`
}
<button onclick="add('${j.n}', ${j.p})" class="btn-cart" ${!enStock ? 'disabled style="opacity:0.5"' : ''}>🛒</button>
</div>
</div>
</div>
`}).join('');
}

function filtrerCatalogue() {
const recherche = document.getElementById('searchBar').value.toLowerCase();
const cards = document.querySelectorAll('.jeu-card');

cards.forEach(card => {
const nom = card.getAttribute('data-nom');
const prix = parseInt(card.getAttribute('data-prix'));

const correspondanceNom = nom.includes(recherche);
const correspondancePrix = (prixMaxFiltre === 'all') || (prix <= prixMaxFiltre);

card.style.display = (correspondanceNom && correspondancePrix) ? 'flex' : 'none';
});
}

function filtrerPrix(max, element) {
prixMaxFiltre = max;
document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
element.classList.add('active');
filtrerCatalogue();
}

function ouvrirModal(nom, estChaussure) {
const produit = [...listeJeux, ...listeAccessoires].find(item => item.n === nom);
if (!produit) return;

document.getElementById('modalNom').innerText = produit.n;
document.getElementById('modalImg').src = produit.img;

let contenu = `<ul><li><b>Prix :</b> ${produit.p.toLocaleString()} FCFA</li>`;

if (estChaussure) {
contenu += `<li><b>Stock restant :</b> ${produit.stock > 0 ? produit.stock + ' paire(s)' : '<span style="color:red">Rupture de stock</span>'}</li>`;

// 1. Menu Déroulant pour les Pointures
if (produit.pointures && produit.pointures.length > 0) {
contenu += `<br><label><b>Choisir la pointure :</b></label>
<select id="pointureSelect">
${produit.pointures.map(pt => `<option value="${pt}">Pointure ${pt}</option>`).join('')}
</select>`;
}

// 2. Bulles de Couleur Cliquables
if (produit.couleurs && produit.couleurs.length > 0) {
couleurSelectionnee = produit.couleurs[0].nom; // Couleur par défaut (la 1ère)
contenu += `<br><label><b>Choisir la couleur : <span id="labelCouleur" style="color:var(--primary);">${couleurSelectionnee}</span></b></label>
<div class="color-options">
${produit.couleurs.map((c, index) => `
<div class="color-bubble ${index === 0 ? 'selected' : ''}"
style="background-color: ${c.code};"
title="${c.nom}"
onclick="choisirCouleur('${c.nom}', this)">
</div>
`).join('')}
</div>`;
}

} else {
contenu += `<li><b>Config :</b> ${produit.req || 'N/A'}</li>
<li><b>Taille :</b> ${produit.tail || 'N/A'}</li>`;
}

contenu += `</ul>`;
document.getElementById('modalDetails').innerHTML = contenu;

const buyBtn = document.getElementById('modalBuyBtn');
if (estChaussure && produit.stock <= 0) {
buyBtn.classList.add('disabled');
buyBtn.innerText = "Produit épuisé";
buyBtn.onclick = null;
} else {
buyBtn.classList.remove('disabled');
buyBtn.innerText = "Acheter maintenant";
buyBtn.onclick = () => {
let url = `paiement.html?jeu=${encodeURIComponent(produit.n)}&prix=${produit.p}`;

if (estChaussure) {
const pointure = document.getElementById('pointureSelect').value;
url += `&pointure=${encodeURIComponent(pointure)}&couleur=${encodeURIComponent(couleurSelectionnee)}`;
}

window.location.href = url;
};
}

document.getElementById('productModal').style.display = 'flex';
}

// Fonction pour gérer la sélection par bulle de couleur
function choisirCouleur(nomCouleur, el) {
couleurSelectionnee = nomCouleur;
document.getElementById('labelCouleur').innerText = nomCouleur;

document.querySelectorAll('.color-bubble').forEach(b => b.classList.remove('selected'));
el.classList.add('selected');
}

function fermerModal() {
document.getElementById('productModal').style.display = 'none';
}

function add(n, p) {
let panier = JSON.parse(localStorage.getItem('asseko_panier')) || [];
panier.push({nom: n, prix: p});
localStorage.setItem('asseko_panier', JSON.stringify(panier));
maj();
alert("Ajouté au panier !");
}

function maj() {
let p = JSON.parse(localStorage.getItem('asseko_panier')) || [];
let el = document.querySelector('#cart-counter span');
if (el) el.innerText = "(" + p.length + ")";
}

window.onload = () => {
generer(listeJeux, 'catalogue', false);
generer(listeAccessoires, 'catalogue-chaussures', true);
maj();
};
</script>
</body>
</html>
