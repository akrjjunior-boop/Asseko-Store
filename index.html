<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asseko Store - Jeux & Articles</title>
<style>
:root {
  --primary: #27ae60;
  --bg: #121212;
  --card: #1e1e1e;
  --text: #ffffff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', Roboto, sans-serif;
  margin: 0;
  padding: 15px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid #333;
}

h1 {
  margin: 0;
  font-size: 1.5rem;
  color: var(--primary);
}

.cart-icon {
  position: relative;
  font-size: 1.5rem;
  text-decoration: none;
  color: white;
}

.cart-badge {
  position: absolute;
  top: -8px;
  right: -10px;
  background: #e74c3c;
  color: white;
  border-radius: 50%;
  padding: 2px 6px;
  font-size: 0.75rem;
  font-weight: bold;
}

.categories {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  overflow-x: auto;
  padding-bottom: 5px;
}

.cat-btn {
  background: #252525;
  color: #ccc;
  border: 1px solid #444;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
}

.cat-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
}

.card {
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #333;
  display: flex;
  flex-direction: column;
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.card-content {
  padding: 10px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
  justify-content: space-between;
}

.card-title {
  font-size: 0.95rem;
  margin: 0 0 5px 0;
}

.card-price {
  color: var(--primary);
  font-weight: bold;
  font-size: 0.9rem;
  margin-bottom: 10px;
}

.btn-buy {
  background: var(--primary);
  color: white;
  border: none;
  padding: 8px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
}

/* Modal pour le choix de la taille / couleur */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 20px;
}

.modal-content {
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
  max-width: 350px;
  width: 100%;
  border: 1px solid var(--primary);
}

.modal-title {
  font-size: 1.1rem;
  margin-top: 0;
}

.option-group {
  margin-bottom: 15px;
}

.option-title {
  font-size: 0.85rem;
  color: #aaa;
  margin-bottom: 8px;
}

.options-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.opt-btn {
  background: #252525;
  border: 1px solid #444;
  color: white;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}

.opt-btn.selected {
  border-color: var(--primary);
  background: var(--primary);
}

.color-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
}

.color-btn.selected {
  border-color: #fff;
  transform: scale(1.1);
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn-secondary {
  background: #444;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 6px;
  flex: 1;
  cursor: pointer;
}

.btn-primary {
  background: var(--primary);
  color: white;
  border: none;
  padding: 10px;
  border-radius: 6px;
  flex: 1;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <h1>Asseko Store</h1>
  <a href="panier.html" class="cart-icon">
    🛒 <span class="cart-badge" id="cartBadge">0</span>
  </a>
</header>

<div class="categories">
  <button class="cat-btn active" onclick="filtrerCat('tous', this)">Tous</button>
  <button class="cat-btn" onclick="filtrerCat('jeux', this)">🎮 Jeux PC</button>
  <button class="cat-btn" onclick="filtrerCat('chaussures', this)">👟 Chaussures</button>
</div>

<div class="grid" id="produitsGrid"></div>

<!-- Modal de Sélection d'Options -->
<div class="modal-overlay" id="modalOptions">
  <div class="modal-content">
    <h3 class="modal-title" id="modalNomProduit">Nom du produit</h3>
    
    <div class="option-group" id="groupPointures" style="display:none;">
      <div class="option-title">Choisir une pointure :</div>
      <div class="options-list" id="listePointures"></div>
    </div>

    <div class="option-group" id="groupCouleurs" style="display:none;">
      <div class="option-title">Choisir une couleur :</div>
      <div class="options-list" id="listeCouleurs"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="fermerModal()">Annuler</button>
      <button class="btn-primary" onclick="validerAchatModal()">Valider & Payez</button>
    </div>
  </div>
</div>

<script>
// Base de données des articles
const produits = [
  {
    id: 1,
    nom: "PES 2017 Configuré PC",
    prix: 3000,
    cat: "jeux",
    img: "https://via.placeholder.com/150/121212/FFFFFF?text=PES+2017"
  },
  {
    id: 2,
    nom: "GTA San Andreas PC",
    prix: 2000,
    cat: "jeux",
    img: "https://via.placeholder.com/150/121212/FFFFFF?text=GTA+SA"
  },
  {
    id: 3,
    nom: "Nike Mercurial Vapor",
    prix: 35000,
    cat: "chaussures",
    img: "https://via.placeholder.com/150/121212/FFFFFF?text=Mercurial",
    pointures: ["39", "40", "41", "42", "43"],
    couleurs: [
      {nom: "Noir", code: "#000000"},
      {nom: "Rose", code: "#ec4899"},
      {nom: "Vert", code: "#2ecc71"}
    ]
  }
];

let produitSelectionne = null;
let pointureChoisie = null;
let couleurChoisie = null;

function afficherProduits(liste) {
  const container = document.getElementById('produitsGrid');
  container.innerHTML = liste.map(p => `
    <div class="card">
      <img src="${p.img}" alt="${p.nom}">
      <div class="card-content">
        <h4 class="card-title">${p.nom}</h4>
        <div class="card-price">${p.prix.toLocaleString()} FCFA</div>
        <button class="btn-buy" onclick="clicAcheter(${p.id})">Acheter</button>
      </div>
    </div>
  `).join('');
}

function filtrerCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (cat === 'tous') {
    afficherProduits(produits);
  } else {
    afficherProduits(produits.filter(p => p.cat === cat));
  }
}

function clicAcheter(id) {
  produitSelectionne = produits.find(p => p.id === id);
  if (!produitSelectionne) return;

  // Si l'article a des options (Pointures / Couleurs)
  if (produitSelectionne.pointures || produitSelectionne.couleurs) {
    ouvrirmodal(produitSelectionne);
  } else {
    // Redirection directe vers paiement pour un article simple
    redirigerVersPaiement(produitSelectionne.nom, produitSelectionne.prix);
  }
}

function ouvrirmodal(p) {
  document.getElementById('modalNomProduit').innerText = p.nom;
  
  const grpP = document.getElementById('groupPointures');
  const lstP = document.getElementById('listePointures');
  const grpC = document.getElementById('groupCouleurs');
  const lstC = document.getElementById('listeCouleurs');

  pointureChoisie = null;
  couleurChoisie = null;

  if (p.pointures && p.pointures.length > 0) {
    grpP.style.display = 'block';
    pointureChoisie = p.pointures[0]; // Choix par défaut
    lstP.innerHTML = p.pointures.map((pt, idx) => `
      <button class="opt-btn ${idx === 0 ? 'selected' : ''}" onclick="selectPointure('${pt}', this)">${pt}</button>
    `).join('');
  } else {
    grpP.style.display = 'none';
  }

  if (p.couleurs && p.couleurs.length > 0) {
    grpC.style.display = 'block';
    couleurChoisie = p.couleurs[0].nom; // Choix par défaut
    lstC.innerHTML = p.couleurs.map((c, idx) => `
      <button class="color-btn ${idx === 0 ? 'selected' : ''}" style="background-color: ${c.code}" title="${c.nom}" onclick="selectCouleur('${c.nom}', this)"></button>
    `).join('');
  } else {
    grpC.style.display = 'none';
  }

  document.getElementById('modalOptions').style.display = 'flex';
}

function selectPointure(pt, btn) {
  document.querySelectorAll('#listePointures .opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  pointureChoisie = pt;
}

function selectCouleur(cNom, btn) {
  document.querySelectorAll('#listeCouleurs .color-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  couleurChoisie = cNom;
}

function fermerModal() {
  document.getElementById('modalOptions').style.display = 'none';
}

function validerAchatModal() {
  fermerModal();
  redirigerVersPaiement(produitSelectionne.nom, produitSelectionne.prix, pointureChoisie, couleurChoisie);
}

function redirigerVersPaiement(nom, prix, pointure = null, couleur = null) {
  let url = `paiement.html?jeu=${encodeURIComponent(nom)}&prix=${prix}`;
  if (pointure) url += `&pointure=${encodeURIComponent(pointure)}`;
  if (couleur) url += `&couleur=${encodeURIComponent(couleur)}`;
  window.location.href = url;
}

function majBadgePanier() {
  let panier = JSON.parse(localStorage.getItem('asseko_panier')) || [];
  document.getElementById('cartBadge').innerText = panier.length;
}

// Initialisation
window.onload = function() {
  afficherProduits(produits);
  majBadgePanier();
};
</script>
</body>
</html>
