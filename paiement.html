<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asseko Store - Finaliser la commande</title>
<style>
:root {
--primary: #27ae60;
--bg: #121212;
--card: #1e1e1e;
--text: #ffffff;
}

body {
background: var(--bg);
color: var(--text);
font-family: 'Segoe UI', Roboto, sans-serif;
margin: 0;
padding: 20px;
}

.container {
max-width: 500px;
margin: 20px auto;
background: var(--card);
padding: 25px;
border-radius: 16px;
border: 1px solid var(--primary);
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

h2 {
color: var(--primary);
text-align: center;
margin-top: 0;
}

.recap-box {
background: #181818;
border: 1px solid #333;
border-radius: 10px;
padding: 15px;
margin-bottom: 20px;
font-size: 0.95rem;
line-height: 1.6;
}

.recap-item {
display: flex;
justify-content: space-between;
border-bottom: 1px dashed #333;
padding: 6px 0;
}
.recap-item:last-child { border-bottom: none; }

.form-group {
margin-bottom: 15px;
}

label {
display: block;
font-size: 0.85rem;
margin-bottom: 5px;
color: #ccc;
}

input[type="text"], input[type="tel"] {
width: 100%;
padding: 12px;
border-radius: 8px;
border: 1px solid #333;
background: #252525;
color: white;
font-size: 1rem;
box-sizing: border-box;
outline: none;
}
input:focus { border-color: var(--primary); }

.btn-whatsapp {
width: 100%;
background: #25d366;
color: white;
border: none;
padding: 14px;
border-radius: 8px;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
margin-top: 20px;
}
.btn-whatsapp:hover { background: #20ba5a; }

.back-link {
display: block;
text-align: center;
margin-top: 15px;
color: #888;
text-decoration: none;
font-size: 0.85rem;
}
.back-link:hover { color: white; }
</style>
</head>
<body>

<div class="container">
<h2>Validation de Commande</h2>

<div class="recap-box" id="recapitulatif">
<!-- Rempli automatiquement via JS -->
</div>

<form id="formCommande" onsubmit="event.preventDefault(); envoyerWhatsApp();">
<div class="form-group">
<label for="nom">Nom & Prénom *</label>
<input type="text" id="nom" required placeholder="Ex: Jean Dupont">
</div>

<div class="form-group">
<label for="telephone">Numéro Téléphone / WhatsApp *</label>
<input type="tel" id="telephone" required placeholder="Ex: 074000000">
</div>

<button type="submit" class="btn-whatsapp">
📲 Valider et envoyer via WhatsApp
</button>
</form>

<a href="index.html" class="back-link">← Retourner à la boutique</a>
</div>

<script>
// 1. Récupération des données dans l'URL
const urlParams = new URLSearchParams(window.location.search);
const nomArticle = urlParams.get('jeu') || "Article";
const prixArticle = urlParams.get('prix') || "0";
const pointureArticle = urlParams.get('pointure');
const couleurArticle = urlParams.get('couleur');

// Numéro WhatsApp de réception
const numeroWhatsApp = "24100000000";

// 2. Affichage du récapitulatif sur la page
const recapBox = document.getElementById('recapitulatif');
let htmlRecap = `
<div class="recap-item"><span>Article :</span> <strong>${nomArticle}</strong></div>
<div class="recap-item"><span>Prix :</span> <strong style="color:var(--primary);">${parseInt(prixArticle).toLocaleString()} FCFA</strong></div>
`;

if (pointureArticle) {
htmlRecap += `<div class="recap-item"><span>Pointure :</span> <strong>${pointureArticle}</strong></div>`;
}

if (couleurArticle) {
htmlRecap += `<div class="recap-item"><span>Couleur :</span> <strong>${couleurArticle}</strong></div>`;
}

recapBox.innerHTML = htmlRecap;

// 3. Envoi du message formaté vers WhatsApp
function envoyerWhatsApp() {
const nomClient = document.getElementById('nom').value.trim();
const telClient = document.getElementById('telephone').value.trim();

if (!nomClient || !telClient) {
alert("Veuillez remplir vos informations.");
return;
}

let message = `Bonjour Asseko Store ! 👋\n\n`;
message += `Je souhaite valider ma commande :\n`;
message += `• *Article :* ${nomArticle}\n`;
message += `• *Prix :* ${parseInt(prixArticle).toLocaleString()} FCFA\n`;

if (pointureArticle) {
message += `• *Pointure :* ${pointureArticle}\n`;
}
if (couleurArticle) {
message += `• *Couleur :* ${couleurArticle}\n`;
}

message += `\n*Informations Client :*\n`;
message += `• *Nom :* ${nomClient}\n`;
message += `• *Téléphone :* ${telClient}\n\n`;
message += `Merci de me confirmer la disponibilité et les modalités de paiement !`;

const urlFinal = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(message)}`;
window.location.href = urlFinal;
}
</script>
</body>
</html>
